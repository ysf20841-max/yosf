{% extends "base.html" %}{% block title %}إنشاء حساب{% endblock %}{% block content %}<div class="mx-auto max-w-sm px-4 py-8"><div class="rounded-3xl border border-gray-800 bg-gray-900 p-6 shadow-xl"><h1 class="mb-2 text-xl font-black text-white">إنشاء حساب جديد</h1><p class="mb-6 text-xs text-gray-400">انضم إلى أوج ميديا</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<p class="mb-3 rounded-xl bg-gray-950 p-3 text-xs text-cyan-300">{{ m }}</p>{% endfor %}{% endwith %}<form method="post" class="space-y-3"><input name="full_name" placeholder="الاسم الكامل" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><input name="username" required minlength="3" placeholder="اسم المستخدم" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><input name="email" type="email" placeholder="البريد الإلكتروني" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><input name="phone" placeholder="رقم الهاتف" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><input name="password" type="password" required minlength="8" placeholder="كلمة المرور (8 أحرف على الأقل)" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><button class="w-full rounded-xl bg-cyan-500 p-3 text-xs font-black text-gray-950">إنشاء الحساب</button></form><p class="mt-5 text-center text-xs text-gray-400">لديك حساب؟ <a href="/login" class="text-cyan-400">تسجيل الدخول</a></p></div></div>{% endblock %}
