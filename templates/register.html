{% extends "base.html" %}
{% block title %}حساب جديد | NEXUS SMM{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-cardBg border border-gray-800 p-5 rounded-2xl shadow-xl">
    <h2 class="text-base font-black text-cyan-400 mb-4 text-center">إنشاء حساب جديد</h2>
    <form action="/register" method="POST" class="space-y-3">
        <div>
            <label class="block text-xs text-gray-300 mb-1">اسم المستخدم:</label>
            <input type="text" name="username" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
        </div>
        <div>
            <label class="block text-xs text-gray-300 mb-1">البريد الإلكتروني:</label>
            <input type="email" name="email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
        </div>
        <div>
            <label class="block text-xs text-gray-300 mb-1">كلمة المرور:</label>
            <input type="password" name="password" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
        </div>
        <div>
            <label class="block text-xs text-gray-300 mb-1">الجنس (لتخصيص الأفاتار):</label>
            <select name="gender" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
                <option value="male">ذكر</option>
                <option value="female">أنثى</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-cyan-500 text-gray-950 font-bold py-2.5 rounded-xl text-xs">تسجيل الحساب</button>
    </form>
</div>
{% endblock %}
