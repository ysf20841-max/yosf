{% extends "base.html" %}
{% block title %}{{ category_name }} | أوج ميديا{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center bg-cardDark border border-gray-800 p-4 rounded-2xl shadow-md">
        <h1 class="text-base sm:text-lg font-black text-cyan-400">{{ category_name }}</h1>
        <a href="/" class="text-xs bg-gray-900 border border-gray-700 text-gray-300 px-3 py-2 rounded-xl font-black">← العودة للأقسام</a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {% for s in services %}
        <div class="bg-cardDark border border-gray-800/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between hover:border-cyan-500/50 transition-all">
            <div>
                <div class="flex items-center gap-3.5 mb-3">
                    <img src="{{ s.service_image_url or s.sub_category_image_url or s.category_image_url or 'https://via.placeholder.com/80' }}" class="w-16 h-16 object-cover rounded-2xl bg-gray-900 border border-gray-700 p-1 flex-shrink-0">
                    <div>
                        <h3 class="text-sm font-black text-white mb-1">{{ s.name }}</h3>
                        <span class="text-xs font-bold text-cyan-400 price-tag" data-usd="{{ s.price_usd }}" data-syp="{{ s.price_syp }}">${{ "%.2f"|format(s.price_usd) }}</span>
                    </div>
                </div>
            </div>

            <button type="button" onclick="openOrderModal('{{ s.id }}', '{{ s.name }}', '{{ s.price_usd }}', '{{ s.price_syp }}', '{{ s.input_label }}', '{{ s.service_type }}', '{{ s.min_quantity }}', '{{ s.max_quantity }}')" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-gray-950 font-black py-3 rounded-xl text-xs shadow-lg transition-transform active:scale-95 mt-3">
                شراء أو طلب الخدمة 🛒
            </button>
        </div>
        {% endfor %}
    </div>
</div>

<!-- النافذة المنبثقة (Modal) -->
<div id="orderModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-cardDark border border-gray-800 rounded-3xl p-6 w-full max-w-md shadow-2xl relative animate-in fade-in zoom-in duration-200">
        <button type="button" onclick="closeOrderModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white text-xl font-black w-8 h-8 flex items-center justify-center rounded-full bg-gray-900 border border-gray-800">&times;</button>
        
        <div class="text-center mb-4">
            <h3 id="modal-service-name" class="text-base font-black text-cyan-400">اسم الخدمة</h3>
        </div>

        <form action="/order" method="POST" class="space-y-4">
            <input type="hidden" name="service_id" id="modal-service-id">
            <input type="hidden" id="modal-base-price" value="0">
            <input type="hidden" id="modal-service-type" value="game">
            
            <div>
                <label id="modal-input-label" class="block text-xs font-bold text-gray-300 mb-1.5">معرّف الحساب (ID)</label>
                <input type="text" name="target_input" required placeholder="أدخل البيانات هنا..." class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-3 text-xs text-white font-bold">
            </div>

            <div id="quantity-container" class="hidden">
                <label id="modal-qty-label" class="block text-xs font-bold text-gray-300 mb-1.5">الكمية:</label>
                <input type="number" name="quantity" id="modal-quantity" value="1" oninput="calculateTotal()" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-3 text-xs text-white font-bold">
            </div>

            <!-- السعر الإجمالي تحت الكمية مباشرة -->
            <div class="bg-gray-900/80 border border-gray-800 p-3.5 rounded-2xl flex justify-between items-center">
                <span class="text-xs font-bold text-gray-400">السعر الإجمالي:</span>
                <span id="modal-service-price" class="text-sm font-black text-amber-400">$0.00</span>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white font-black py-3.5 rounded-xl text-xs shadow-lg transition-transform active:scale-95">
                ✨ تأكيد والخصم من المحفظة
            </button>
        </form>
    </div>
</div>

<script>
    function openOrderModal(id, name, priceUsd, priceSyp, inputLabel, serviceType, minQty, maxQty) {
        document.getElementById('modal-service-id').value = id;
        document.getElementById('modal-service-name').innerText = name;
        document.getElementById('modal-input-label').innerText = inputLabel;
        document.getElementById('modal-base-price').value = priceUsd;
        document.getElementById('modal-service-type').value = serviceType;

        const qtyContainer = document.getElementById('quantity-container');
        const qtyInput = document.getElementById('modal-quantity');
        const qtyLabel = document.getElementById('modal-qty-label');

        if (serviceType === 'api') {
            qtyContainer.classList.remove('hidden');
            qtyInput.min = minQty;
            qtyInput.max = maxQty;
            qtyInput.value = minQty;
            qtyLabel.innerText = `الكمية (الحد الأدنى: ${minQty} - الحد الأقصى: ${maxQty}):`;
        } else {
            qtyContainer.classList.add('hidden');
            qtyInput.value = 1;
        }

        calculateTotal();
        document.getElementById('orderModal').classList.remove('hidden');
    }

    function calculateTotal() {
        const basePrice = parseFloat(document.getElementById('modal-base-price').value) || 0;
        const serviceType = document.getElementById('modal-service-type').value;
        const qty = parseInt(document.getElementById('modal-quantity').value) || 1;
        
        let total = serviceType === 'api' ? (basePrice / 1000) * qty : basePrice * qty;

        const isSyp = typeof currentCurrency !== 'undefined' && currentCurrency === 'SYP';
        const priceFormatted = isSyp ? (total * 150).toLocaleString('ar-EG') + ' ل.س' : '$' + total.toFixed(2);
        
        document.getElementById('modal-service-price').innerText = priceFormatted;
    }

    function closeOrderModal() {
        document.getElementById('orderModal').classList.add('hidden');
    }
</script>
{% endblock %}
