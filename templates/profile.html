{% extends "base.html" %}{% block title %}حسابي الشخصي{% endblock %}{% block content %}<div class="mx-auto max-w-lg px-4 py-6"><div class="rounded-3xl border border-gray-800 bg-gray-900 p-6"><h1 class="mb-5 text-lg font-black text-white">حسابي الشخصي</h1><div class="mb-5 rounded-2xl border border-cyan-500/20 bg-cyan-500/5 p-4"><p class="text-xs text-gray-400">رصيد المحفظة</p><p class="mt-1 text-2xl font-black text-cyan-400">${{ '%.2f'|format(user.balance_usd) }}</p><p class="mt-2 text-[11px] text-gray-500">معرّف المستخدم: #{{ user.id }}</p></div><form method="post" class="space-y-3"><label class="block text-xs text-gray-400">الاسم الكامل</label><input name="full_name" value="{{ user.full_name }}" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><label class="block text-xs text-gray-400">البريد الإلكتروني</label><input name="email" type="email" value="{{ user.email }}" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><label class="block text-xs text-gray-400">الهاتف</label><input name="phone" value="{{ user.phone }}" class="w-full rounded-xl border border-gray-800 bg-gray-950 p-3 text-xs text-white"><button class="w-full rounded-xl bg-cyan-500 p-3 text-xs font-black text-gray-950">حفظ التعديلات</button></form><a href="/verification" class="mt-4 flex items-center justify-center gap-2 rounded-xl border border-blue-500/30 bg-blue-500/10 p-3 text-xs font-black text-blue-300">{% if user.is_verified %}✓ حسابك موثّق{% else %}توثيق الحساب{% endif %}</a></div></div>{% endblock %}
