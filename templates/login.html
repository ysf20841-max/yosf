{% extends "base.html" %}
{% block title %}تسجيل الدخول | أوج ميديا{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8 bg-cardLight dark:bg-cardDark border border-gray-200 dark:border-gray-800 rounded-3xl p-6 shadow-2xl">
    <div class="text-center mb-6">
        <h2 class="text-xl font-black text-cyan-400 mb-1">تسجيل الدخول</h2>
        <p class="text-xs text-gray-400 font-semibold">مرحباً بك مجدداً في منصة أوج ميديا</p>
    </div>

    {% if error %}
    <div class="bg-rose-500/20 border border-rose-500/40 text-rose-400 text-xs p-3 rounded-xl mb-4 font-bold text-center">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-300 mb-1.5">اسم المستخدم:</label>
            <input type="text" name="username" required placeholder="أدخل اسم المستخدم..." class="w-full bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 text-xs text-gray-900 dark:text-white focus:border-cyan-500 focus:outline-none font-semibold">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-300 mb-1.5">كلمة المرور:</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 text-xs text-gray-900 dark:text-white focus:border-cyan-500 focus:outline-none font-semibold">
        </div>

        <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-black py-3.5 rounded-2xl text-xs shadow-xl active:scale-95 transition-transform mt-2">
            تسجيل الدخول 🚀
        </button>
    </form>
    
    <p class="text-center text-xs text-gray-400 mt-5">
        ليس لديك حساب؟ <a href="/register" class="text-cyan-400 font-black underline">أنشئ حساباً جديداً</a>
    </p>
</div>
{% endblock %}
